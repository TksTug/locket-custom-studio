<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Locket Widget</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Locket">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
    
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000000;
      color: #ffffff;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    /* Authentic Locket Squircle (42px) */
    .locket-squircle {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
      background: #121217;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.95), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .glass-pill {
      background: rgba(28, 28, 36, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .glass-dock {
      background: rgba(22, 22, 29, 0.88);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Shutter flash animation */
    @keyframes shutterFlash {
      0% { opacity: 0; }
      50% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-effect {
      animation: shutterFlash 0.2s ease-out;
    }

    /* Floating heart reaction animation */
    @keyframes floatUpFade {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-70px) scale(1.4); opacity: 0; }
    }
    .floating-reaction {
      position: absolute;
      animation: floatUpFade 0.85s ease-out forwards;
      pointer-events: none;
      z-index: 60;
    }
  </style>
</head>
<body class="flex flex-col justify-between max-w-md mx-auto h-full relative select-none bg-black">

  <!-- Fullscreen Camera Flash Overlay -->
  <div id="flashOverlay" class="fixed inset-0 bg-white pointer-events-none z-50 opacity-0"></div>

  <!-- ======================================================== -->
  <!-- TOP BAR (IDENTICAL TO REFERENCE IMAGES 1, 3, 4, 6) -->
  <!-- ======================================================== -->
  <header id="appTopBar" class="flex items-center justify-between px-4 pt-3 pb-2 z-30 w-full shrink-0">
    <!-- Left: Friends dropdown pill: [ (L) 32 Bạn bè ˅ ] -->
    <button onclick="openFriendsModal()" class="flex items-center gap-2 glass-pill px-3 py-1.5 rounded-full text-xs font-bold text-white shadow-md active:scale-95 transition-all">
      <span class="w-5 h-5 rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 text-black text-[10px] font-extrabold flex items-center justify-center">L</span>
      <span id="friendsHeaderLabel">32 Bạn bè</span>
      <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
    </button>

    <!-- Center: LOCKET logo in bold gold text -->
    <div class="flex items-center gap-1.5 cursor-pointer" onclick="switchMainTab('feed')">
      <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
      <span class="text-base font-extrabold tracking-wider text-amber-400">LOCKET</span>
    </div>

    <!-- Right: Quick Chat / Settings Button -->
    <div class="flex items-center gap-2">
      <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full glass-pill flex items-center justify-center text-slate-300 hover:text-white active:scale-90 transition-all shadow-md" title="Cài đặt hệ thống">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
      <button onclick="switchMainTab('chat')" id="topBarChatBtn" class="relative w-9 h-9 rounded-full glass-pill flex items-center justify-center text-slate-300 hover:text-white active:scale-90 transition-all shadow-md" title="Tin nhắn">
        <i data-lucide="message-circle" class="w-4 h-4"></i>
        <span id="topChatBadgeDot" class="hidden absolute top-1 right-1 w-2 h-2 bg-amber-400 rounded-full"></span>
      </button>
    </div>
  </header>

  <!-- ======================================================== -->
  <!-- MAIN CONTAINER (3 SWAPPABLE VIEWS: CAMERA | FEED | CHAT) -->
  <!-- ======================================================== -->
  <main class="flex-1 min-h-0 w-full relative overflow-hidden flex flex-col items-center">

    <!-- ======================================================== -->
    <!-- 1. TAB CAMERA (VIEWPORT GỐC TỌA ĐỘ - IMAGES 4 & 6) -->
    <!-- ======================================================== -->
    <section id="viewCamera" class="w-full h-full flex flex-col items-center justify-between px-3 pb-20 pt-1">
      
      <!-- Camera Viewport Container -->
      <div class="w-full flex flex-col items-center justify-center space-y-2.5 my-auto">
        
        <!-- Authentic Locket Squircle Viewport (42px) -->
        <div id="cameraSquircle" class="locket-squircle relative flex items-center justify-center mx-auto" ondblclick="flipCameraOrientation()">
          
          <!-- Live Real Camera Stream -->
          <video id="cameraLiveStream" autoplay playsinline muted class="w-full h-full object-cover"></video>

          <!-- Freeze Captured Photo Preview -->
          <img id="cameraPreviewImage" class="w-full h-full object-cover hidden" alt="Captured Moment">

          <!-- Picked Long Video Preview (2 - 5 min video) -->
          <video id="cameraPreviewVideo" autoplay loop muted playsinline class="w-full h-full object-cover hidden"></video>

          <!-- Top-Left Weather Radar Badge (Overlaid on photo) -->
          <div id="liveWeatherBadge" class="hidden absolute top-4 left-4 z-20 glass-pill px-3 py-1.5 rounded-full flex items-center gap-1.5 text-xs font-bold text-white shadow-xl border border-white/20 bg-black/60 backdrop-blur-md pointer-events-none">
            <span id="liveWeatherIcon">🌧️</span>
            <span id="liveWeatherTemp">33°C</span>
            <span id="liveWeatherCity" class="text-slate-300 text-[10px]">TP.HCM</span>
          </div>

          <!-- POST-CAPTURE: Cancel / Retake Button "X" (Top-Left) -->
          <button id="btnRetakeMedia" onclick="cancelCapturedMedia()" class="hidden absolute top-4 left-4 z-20 glass-pill w-9 h-9 rounded-full flex items-center justify-center text-white active:scale-90 transition-all shadow-lg" title="Hủy / Chụp lại">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>

          <!-- Viewport Controls (Top-Right / Bottom-Right) -->
          <div class="absolute top-4 right-4 flex items-center gap-2 z-20">
            <!-- Flash Toggle -->
            <button onclick="cycleFlashMode()" id="btnFlashToggle" class="glass-pill w-8 h-8 rounded-full flex items-center justify-center text-slate-300 active:scale-90 transition-all shadow-md" title="Flash">
              <i id="flashIcon" data-lucide="zap-off" class="w-4 h-4"></i>
            </button>
            <!-- Weather Radar Toggle -->
            <button onclick="toggleWeatherRadar()" id="btnWeatherToggle" class="glass-pill w-8 h-8 rounded-full flex items-center justify-center text-slate-300 active:scale-90 transition-all shadow-md" title="Thời tiết Radar">
              <i data-lucide="cloud-rain" class="w-4 h-4"></i>
            </button>
            <!-- Custom Frames Toggle -->
            <button onclick="cycleFrameType()" id="btnFrameCycle" class="glass-pill w-8 h-8 rounded-full flex items-center justify-center text-slate-300 active:scale-90 transition-all shadow-md" title="Khung ảnh">
              <i data-lucide="crop" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- Bottom Caption Overlay Tag inside frame -->
          <div id="cameraCaptionTag" class="hidden absolute bottom-4 left-4 right-4 bg-black/65 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-white/10 flex items-center justify-center text-center z-10 shadow-lg cursor-pointer" onclick="focusCaptionInput()">
            <span id="cameraCaptionText" class="text-xs font-semibold text-white"></span>
          </div>
        </div>

        <!-- Caption Input Bar right below viewfinder (Image 4) -->
        <div id="captionInputBar" class="w-full max-w-[360px] flex items-center gap-2 glass-pill px-4 py-2 rounded-2xl">
          <input type="text" id="cameraCaptionInput" placeholder="Viết chú thích cho khoảnh khắc..." class="flex-1 bg-transparent text-xs text-white placeholder-slate-400 focus:outline-none" oninput="handleCaptionInput()">
          <button onclick="openColorPalette()" class="text-xs text-amber-400 hover:text-amber-300 font-medium">Màu sắc</button>
        </div>

        <!-- POST-CAPTURE: Recipient Selection Matrix (SPEC I.2) -->
        <div id="recipientMatrixContainer" class="hidden w-full max-w-[360px] flex flex-col space-y-1.5 pt-1">
          <div class="flex items-center justify-between px-2 text-[11px] text-slate-400 font-medium">
            <span>Gửi đến bạn bè:</span>
            <button onclick="selectAllFriends()" class="text-amber-400 text-[10px] font-bold">Chọn tất cả</button>
          </div>
          <!-- Horizontal Scroll Avatars -->
          <div id="recipientHorizontalList" class="flex items-center gap-3 overflow-x-auto no-scrollbar py-1 px-1">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Hidden input for Gallery Picker (Locket Gold Feature) -->
        <input type="file" id="inputMediaFile" accept="image/*,video/*" class="hidden" onchange="handleMediaSelected(event)">

        <!-- Status Pill -->
        <div id="cameraStatusPill" class="hidden text-[11px] font-medium text-amber-300 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-center"></div>

      </div>

      <!-- Action Buttons Row (Above Dock) -->
      <div class="w-full max-w-[340px] flex items-center justify-between px-2 mt-auto">
        <!-- Left: Gallery Picker (🖼️ Locket Gold Album Picker) -->
        <button onclick="triggerGalleryPicker()" class="w-13 h-13 rounded-2xl glass-pill p-3 flex items-center justify-center text-white active:scale-90 transition-all shadow-lg hover:border-amber-400/40" title="Chọn từ Album (Locket Gold)">
          <i data-lucide="image" class="w-6 h-6 text-amber-300"></i>
        </button>

        <!-- Center: Giant Circular Shutter Button (Image 4 & 6) -->
        <div class="relative flex items-center justify-center">
          <div id="shutterRing" class="w-20 h-20 rounded-full border-[5px] border-amber-400 p-1 flex items-center justify-center ring-4 ring-amber-400/20">
            <button id="btnShutterAction" onclick="handleShutterClick()" class="w-full h-full rounded-full bg-white active:scale-90 transition-all shadow-xl shadow-amber-400/30 flex items-center justify-center text-black">
              <i id="btnShutterIcon" data-lucide="send" class="w-7 h-7 text-black hidden"></i>
            </button>
          </div>
        </div>

        <!-- Right: Flip Camera Orientation [🔄] -->
        <button onclick="flipCameraOrientation()" class="w-13 h-13 rounded-full glass-pill p-3 flex items-center justify-center text-white active:scale-90 transition-all shadow-lg hover:border-amber-400/40" title="Đổi camera trước / sau">
          <i data-lucide="refresh-cw" class="w-6 h-6 text-slate-200"></i>
        </button>
      </div>

      <!-- History shortcut pill directly under Shutter (Image 6 & PanResponder trigger) -->
      <button onclick="switchMainTab('feed')" class="mt-2 flex items-center gap-1.5 px-3.5 py-1.5 rounded-full glass-pill text-xs font-semibold text-slate-300 hover:text-white active:scale-95 transition-all shadow-md">
        <div class="w-4 h-4 rounded-full bg-slate-700 overflow-hidden flex items-center justify-center text-[9px] text-amber-300 font-bold">
          <i data-lucide="image" class="w-2.5 h-2.5"></i>
        </div>
        <span>Lịch sử</span>
        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
      </button>

    </section>

    <!-- ======================================================== -->
    <!-- 2. TAB KHOẢNH KHẮC / FEED (IDENTICAL TO REFERENCE IMAGE 3) -->
    <!-- ======================================================== -->
    <section id="viewFeed" class="hidden w-full h-full flex flex-col pb-24 overflow-y-auto no-scrollbar" style="touch-action: pan-y; -webkit-overflow-scrolling: touch;">
      
      <!-- Friends Filter Chips Row -->
      <div class="px-4 py-2 border-b border-white/10 shrink-0">
        <div id="feedFriendsFilterRow" class="flex items-center gap-2.5 overflow-x-auto no-scrollbar py-1">
          <!-- Dynamically populated: All + Friend Avatars -->
        </div>
      </div>

      <!-- Feed Moments Container -->
      <div id="feedMomentsList" class="flex flex-col items-center space-y-7 p-4 pt-4">
        <!-- Dynamically rendered moments matching Image 3 -->
      </div>
    </section>

    <!-- ======================================================== -->
    <!-- 3. TAB TIN NHẮN / CHAT (IDENTICAL TO REFERENCE IMAGE 4) -->
    <!-- ======================================================== -->
    <section id="viewChat" class="hidden w-full h-full flex flex-col px-4 pb-24 overflow-y-auto no-scrollbar" style="touch-action: pan-y; -webkit-overflow-scrolling: touch;">
      
      <!-- Chat Header Info (Image 4) -->
      <div class="flex items-center justify-between pt-3 pb-3 shrink-0">
        <div class="flex items-center gap-2 text-base font-bold text-white">
          <i data-lucide="message-square" class="w-5 h-5 text-pink-400"></i>
          <span>Tin nhắn Locket</span>
        </div>
        <div id="chatConversationsCount" class="text-xs font-semibold text-slate-400">
          27 cuộc trò chuyện
        </div>
      </div>

      <!-- Search Input -->
      <div class="glass-pill px-3 py-2 rounded-2xl flex items-center gap-2 mb-3 shrink-0">
        <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
        <input type="text" id="chatSearchInput" placeholder="Tìm kiếm cuộc trò chuyện..." class="bg-transparent text-xs text-white placeholder-slate-400 flex-1 focus:outline-none" oninput="filterChatConversations()">
      </div>

      <!-- Conversations List -->
      <div id="chatConversationsContainer" class="flex flex-col space-y-2 pb-6">
        <!-- Dynamically rendered conversations matching Image 4 -->
      </div>
    </section>

    <!-- ======================================================== -->
    <!-- 4. DIRECT 1-ON-1 CHAT ROOM (IMAGE 5 SCREEN 1) -->
    <!-- ======================================================== -->
    <section id="viewDirectChat" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
      <!-- Direct Chat Top Bar -->
      <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 shrink-0 bg-[#121217]">
        <div class="flex items-center gap-3">
          <button onclick="closeDirectChat()" class="w-8 h-8 rounded-full glass-pill flex items-center justify-center text-white active:scale-90">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
          </button>
          <div id="directChatPeerAvatar" class="w-9 h-9 rounded-full bg-slate-700 ring-2 ring-amber-400 overflow-hidden flex items-center justify-center text-xs font-bold text-white"></div>
          <div>
            <div id="directChatPeerName" class="text-xs font-bold text-white">Tên bạn bè</div>
            <div id="directChatPeerUsername" class="text-[10px] text-slate-400">@username</div>
          </div>
        </div>
        <!-- Reply with Camera Button -->
        <button onclick="replyWithCameraFromChat()" class="flex items-center gap-1.5 glass-pill px-3 py-1.5 rounded-full text-xs font-bold text-amber-300 active:scale-95">
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>Chụp ảnh</span>
        </button>
      </div>

      <!-- Message History Container -->
      <div id="directChatMessagesContainer" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 no-scrollbar" style="touch-action: pan-y; -webkit-overflow-scrolling: touch;">
        <!-- Dynamically loaded messages -->
      </div>

      <!-- Message Input Bar (Image 5 Screen 1) -->
      <div class="p-3 border-t border-white/10 shrink-0 bg-[#121217] space-y-2">
        <!-- Quick Emojis -->
        <div class="flex items-center gap-3 px-2">
          <button onclick="sendQuickEmoji('🔥')" class="text-lg active:scale-75 transition-all">🔥</button>
          <button onclick="sendQuickEmoji('❤️')" class="text-lg active:scale-75 transition-all">❤️</button>
          <button onclick="sendQuickEmoji('😂')" class="text-lg active:scale-75 transition-all">😂</button>
          <button onclick="sendQuickEmoji('🥺')" class="text-lg active:scale-75 transition-all">🥺</button>
          <button onclick="sendQuickEmoji('🎉')" class="text-lg active:scale-75 transition-all">🎉</button>
        </div>
        <!-- Text Input & Send -->
        <div class="flex items-center gap-2">
          <input type="text" id="directChatMessageInput" placeholder="Nhập tin nhắn..." class="flex-1 glass-pill px-4 py-2.5 rounded-2xl text-xs text-white placeholder-slate-400 focus:outline-none" onkeydown="if(event.key === 'Enter') sendDirectChatMessage()">
          <button onclick="sendDirectChatMessage()" class="w-10 h-10 rounded-2xl bg-amber-400 text-black flex items-center justify-center active:scale-90 transition-all font-bold shadow-lg">
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- ======================================================== -->
  <!-- FLOATING BOTTOM DOCK (EXACTLY AS IN IMAGES 1, 3, 4) -->
  <!-- ======================================================== -->
  <nav id="floatingBottomDock" class="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 flex items-center gap-9 px-8 py-3 rounded-full glass-dock shadow-2xl">
    <!-- Tab 1: Camera (Home View) -->
    <button onclick="switchMainTab('camera')" id="dockTabCamera" class="p-1 text-amber-400 transition-all active:scale-90" title="Camera">
      <i data-lucide="camera" class="w-6 h-6"></i>
    </button>

    <!-- Tab 2: Feed / Khoảnh khắc (Sparkles) -->
    <button onclick="switchMainTab('feed')" id="dockTabFeed" class="p-1 text-slate-400 hover:text-white transition-all active:scale-90" title="Khoảnh khắc">
      <i data-lucide="sparkles" class="w-6 h-6"></i>
    </button>

    <!-- Tab 3: Chat / Tin nhắn (Message Circle) -->
    <button onclick="switchMainTab('chat')" id="dockTabChat" class="relative p-1 text-slate-400 hover:text-white transition-all active:scale-90" title="Tin nhắn">
      <i data-lucide="message-circle" class="w-6 h-6"></i>
      <span id="dockChatBadgeDot" class="hidden absolute top-0 right-0 w-2 h-2 bg-amber-400 rounded-full"></span>
    </button>
  </nav>

  <!-- ======================================================== -->
  <!-- FRIENDS MODAL / BOTTOM SHEET (IMAGE 5 SCREEN 2) -->
  <!-- ======================================================== -->
  <div id="friendsModal" class="fixed inset-0 bg-black/80 z-50 flex flex-col justify-end hidden">
    <div class="w-full max-h-[85vh] bg-[#16161d] rounded-t-[36px] border-t border-white/15 p-5 flex flex-col space-y-3.5 shadow-2xl">
      <!-- Handle -->
      <div class="w-12 h-1 bg-white/20 rounded-full mx-auto cursor-pointer" onclick="closeFriendsModal()"></div>
      
      <!-- Title -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-rose-500 text-lg">❤️</span>
          <span id="friendsModalTitle" class="text-base font-extrabold text-white">32 Bạn bè</span>
        </div>
        <button onclick="closeFriendsModal()" class="w-8 h-8 rounded-full glass-pill flex items-center justify-center text-white active:scale-90">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <p class="text-xs text-slate-400">Danh sách bạn bè thân thiết nhận khoảnh khắc Widget</p>

      <!-- Search Friends -->
      <div class="glass-pill px-3 py-2 rounded-2xl flex items-center gap-2">
        <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
        <input type="text" id="friendSearchModalInput" placeholder="Tìm kiếm bạn bè..." class="bg-transparent text-xs text-white placeholder-slate-400 flex-1 focus:outline-none" oninput="filterModalFriends()">
      </div>

      <!-- Friends List -->
      <div id="friendsListModalContainer" class="flex-1 min-h-0 overflow-y-auto space-y-2 pr-1 no-scrollbar max-h-[50vh]" style="touch-action: pan-y; -webkit-overflow-scrolling: touch;">
        <!-- Dynamically rendered -->
      </div>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- SETTINGS MODAL -->
  <!-- ======================================================== -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-[#16161d] rounded-3xl border border-white/15 p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="settings" class="w-4 h-4 text-amber-400"></i>
          <span>Cài đặt hệ thống</span>
        </h3>
        <button onclick="closeSettingsModal()" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-white active:scale-90">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Account Card -->
      <div class="glass-pill p-3.5 rounded-2xl space-y-2">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-amber-400 to-rose-500 text-black font-extrabold flex items-center justify-center text-sm shadow-md">U</div>
          <div>
            <div id="settingsUserName" class="text-xs font-bold text-white">Người dùng Locket</div>
            <div id="settingsUserUid" class="text-[10px] text-slate-400 font-mono">UID: ...</div>
          </div>
        </div>
        <!-- Locket Gold Status -->
        <div class="flex items-center justify-between pt-1 border-t border-white/10 text-xs">
          <span class="text-amber-300 font-bold flex items-center gap-1">
            <i data-lucide="crown" class="w-3.5 h-3.5"></i>
            <span>Locket Gold Unlocked</span>
          </span>
          <span class="px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-400 text-[10px] font-bold">VIP Vĩnh viễn</span>
        </div>
      </div>

      <div class="space-y-2 text-xs text-slate-300">
        <div class="flex items-center justify-between p-2 rounded-xl glass-pill">
          <span>Nén video 2-5 phút H.264</span>
          <span class="text-emerald-400 font-bold">Bật</span>
        </div>
        <div class="flex items-center justify-between p-2 rounded-xl glass-pill">
          <span>Sticker radar thời tiết</span>
          <span class="text-emerald-400 font-bold">Bật</span>
        </div>
      </div>

      <button onclick="logoutSession()" class="w-full py-2.5 rounded-2xl bg-rose-500/20 border border-rose-500/30 text-rose-300 text-xs font-bold hover:bg-rose-500/30 active:scale-95 transition-all">
        Đăng xuất tài khoản
      </button>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- JAVASCRIPT LOGIC -->
  <!-- ======================================================== -->
  <script>
    // System State
    let activeTab = 'camera'; // 'camera', 'feed', 'chat'
    let cameraStream = null;
    let cameraFacing = 'user'; // 'user' or 'environment'
    let flashMode = 'off'; // 'off', 'on', 'auto'
    let capturedBlob = null;
    let isVideoMedia = false;
    let isPostCaptureState = false;
    let selectedRecipients = new Set();
    let allFriendsList = [];
    let allConversationsList = [];
    let allMomentsList = [];
    let activeFeedFilterUid = null;
    let activeDirectChatPeerUid = null;
    let weatherData = null;
    let weatherOverlayActive = false;
    let selectedFrame = 'none'; // 'none', 'polaroid', 'cinema'

    // Initialization
    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await initializeCamera();
      await loadFriends();
      await loadFeed();
      await loadChatConversations();
      await fetchWeatherData();
    });

    // ==========================================
    // 1. MAIN TAB SWITCHER (CAMERA | FEED | CHAT)
    // ==========================================
    function switchMainTab(tab) {
      activeTab = tab;
      
      const viewCamera = document.getElementById('viewCamera');
      const viewFeed = document.getElementById('viewFeed');
      const viewChat = document.getElementById('viewChat');
      
      const tabCamBtn = document.getElementById('dockTabCamera');
      const tabFeedBtn = document.getElementById('dockTabFeed');
      const tabChatBtn = document.getElementById('dockTabChat');

      // Reset visibility
      viewCamera.classList.add('hidden');
      viewFeed.classList.add('hidden');
      viewChat.classList.add('hidden');

      // Reset dock button colors
      tabCamBtn.className = "p-1 text-slate-400 hover:text-white transition-all active:scale-90";
      tabFeedBtn.className = "p-1 text-slate-400 hover:text-white transition-all active:scale-90";
      tabChatBtn.className = "relative p-1 text-slate-400 hover:text-white transition-all active:scale-90";

      if (tab === 'camera') {
        viewCamera.classList.remove('hidden');
        tabCamBtn.className = "p-1 text-amber-400 transition-all active:scale-90";
      } else if (tab === 'feed') {
        viewFeed.classList.remove('hidden');
        tabFeedBtn.className = "p-1 text-pink-400 transition-all active:scale-90";
        renderFeedMoments();
      } else if (tab === 'chat') {
        viewChat.classList.remove('hidden');
        tabChatBtn.className = "relative p-1 text-amber-400 transition-all active:scale-90";
        renderChatConversations(allConversationsList);
      }
      lucide.createIcons();
    }

    // ==========================================
    // 2. CAMERA ENGINE & REAL HARDWARE WEBRTC
    // ==========================================
    async function initializeCamera() {
      const video = document.getElementById('cameraLiveStream');
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: cameraFacing,
            width: { ideal: 1080 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = cameraStream;
      } catch (err) {
        console.warn('Camera access error:', err);
      }
    }

    function flipCameraOrientation() {
      cameraFacing = (cameraFacing === 'user') ? 'environment' : 'user';
      initializeCamera();
    }

    function cycleFlashMode() {
      const modes = ['off', 'on', 'auto'];
      const icons = { off: 'zap-off', on: 'zap', auto: 'zap' };
      const idx = (modes.indexOf(flashMode) + 1) % modes.length;
      flashMode = modes[idx];
      document.getElementById('flashIcon').setAttribute('data-lucide', icons[flashMode]);
      lucide.createIcons();
    }

    // ==========================================
    // 3. CAPTURE & POST-CAPTURE WORKFLOW
    // ==========================================
    function handleShutterClick() {
      if (isPostCaptureState) {
        uploadAndSendMoment();
      } else {
        capturePhotoFromCamera();
      }
    }

    function capturePhotoFromCamera() {
      const video = document.getElementById('cameraLiveStream');
      const previewImg = document.getElementById('cameraPreviewImage');
      const flashOverlay = document.getElementById('flashOverlay');

      // Trigger flash effect
      flashOverlay.classList.remove('opacity-0');
      flashOverlay.classList.add('flash-effect');
      setTimeout(() => {
        flashOverlay.classList.remove('flash-effect');
        flashOverlay.classList.add('opacity-0');
      }, 200);

      // Draw freeze frame
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 720;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      if (cameraFacing === 'user') {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        capturedBlob = blob;
        isVideoMedia = false;
        previewImg.src = URL.createObjectURL(blob);
        enterPostCaptureState();
      }, 'image/jpeg', 0.92);
    }

    function triggerGalleryPicker() {
      document.getElementById('inputMediaFile').click();
    }

    function handleMediaSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      capturedBlob = file;
      isVideoMedia = file.type.startsWith('video/');
      const previewImg = document.getElementById('cameraPreviewImage');
      const previewVid = document.getElementById('cameraPreviewVideo');

      if (isVideoMedia) {
        previewImg.classList.add('hidden');
        previewVid.classList.remove('hidden');
        previewVid.src = URL.createObjectURL(file);
      } else {
        previewVid.classList.add('hidden');
        previewImg.classList.remove('hidden');
        previewImg.src = URL.createObjectURL(file);
      }
      enterPostCaptureState();
    }

    function enterPostCaptureState() {
      isPostCaptureState = true;
      document.getElementById('cameraLiveStream').classList.add('hidden');
      if (!isVideoMedia) {
        document.getElementById('cameraPreviewImage').classList.remove('hidden');
      }
      document.getElementById('btnRetakeMedia').classList.remove('hidden');
      document.getElementById('recipientMatrixContainer').classList.remove('hidden');

      // Transform Shutter button into Send button
      const shutterRing = document.getElementById('shutterRing');
      const shutterBtn = document.getElementById('btnShutterAction');
      const shutterIcon = document.getElementById('btnShutterIcon');
      shutterRing.className = "w-20 h-20 rounded-full border-[5px] border-amber-400 p-1 flex items-center justify-center ring-4 ring-amber-400/40 bg-amber-400";
      shutterBtn.className = "w-full h-full rounded-full bg-amber-400 active:scale-90 transition-all flex items-center justify-center text-black font-extrabold shadow-xl";
      shutterIcon.classList.remove('hidden');

      // Populate recipient selection matrix
      populateRecipientMatrix();
    }

    function cancelCapturedMedia() {
      isPostCaptureState = false;
      capturedBlob = null;
      document.getElementById('cameraLiveStream').classList.remove('hidden');
      document.getElementById('cameraPreviewImage').classList.add('hidden');
      document.getElementById('cameraPreviewVideo').classList.add('hidden');
      document.getElementById('btnRetakeMedia').classList.add('hidden');
      document.getElementById('recipientMatrixContainer').classList.add('hidden');
      document.getElementById('cameraCaptionTag').classList.add('hidden');
      document.getElementById('cameraCaptionInput').value = '';

      // Revert shutter
      const shutterRing = document.getElementById('shutterRing');
      const shutterBtn = document.getElementById('btnShutterAction');
      const shutterIcon = document.getElementById('btnShutterIcon');
      shutterRing.className = "w-20 h-20 rounded-full border-[5px] border-amber-400 p-1 flex items-center justify-center ring-4 ring-amber-400/20";
      shutterBtn.className = "w-full h-full rounded-full bg-white active:scale-90 transition-all shadow-xl shadow-amber-400/30 flex items-center justify-center text-black";
      shutterIcon.classList.add('hidden');
    }

    function handleCaptionInput() {
      const input = document.getElementById('cameraCaptionInput');
      const tag = document.getElementById('cameraCaptionTag');
      const text = document.getElementById('cameraCaptionText');
      if (input.value.trim()) {
        text.innerText = input.value;
        tag.classList.remove('hidden');
      } else {
        tag.classList.add('hidden');
      }
    }

    function focusCaptionInput() {
      document.getElementById('cameraCaptionInput').focus();
    }

    function openColorPalette() {
      alert("Tính năng chọn bảng màu Caption (Locket Gold) đang được đồng bộ!");
    }

    function populateRecipientMatrix() {
      const container = document.getElementById('recipientHorizontalList');
      if (allFriendsList.length === 0) {
        container.innerHTML = '<span class="text-xs text-slate-400">Đang tải danh sách bạn bè...</span>';
        return;
      }
      container.innerHTML = allFriendsList.map(f => {
        const isSelected = selectedRecipients.has(f.uid);
        return `
          <div onclick="toggleRecipient('${f.uid}')" class="flex flex-col items-center gap-1 cursor-pointer shrink-0">
            <div class="relative w-12 h-12 rounded-full p-0.5 transition-all ${isSelected ? 'ring-2 ring-amber-400 scale-105' : 'opacity-70'}">
              ${f.profile_picture ? 
                `<img src="${f.profile_picture}" class="w-full h-full rounded-full object-cover">` : 
                `<div class="w-full h-full rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white">${(f.first_name || 'U')[0]}</div>`
              }
              ${isSelected ? '<span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-amber-400 rounded-full border border-black flex items-center justify-center text-[9px] text-black font-black">✓</span>' : ''}
            </div>
            <span class="text-[10px] text-slate-300 max-w-[50px] truncate text-center">${f.first_name || f.username}</span>
          </div>
        `;
      }).join('');
    }

    function toggleRecipient(uid) {
      if (selectedRecipients.has(uid)) {
        selectedRecipients.delete(uid);
      } else {
        selectedRecipients.add(uid);
      }
      populateRecipientMatrix();
    }

    function selectAllFriends() {
      if (selectedRecipients.size === allFriendsList.length) {
        selectedRecipients.clear();
      } else {
        allFriendsList.forEach(f => selectedRecipients.add(f.uid));
      }
      populateRecipientMatrix();
    }

    // ==========================================
    // 4. UPLOAD & SEND MOMENT
    // ==========================================
    async function uploadAndSendMoment() {
      if (!capturedBlob) {
        alert("Vui lòng chụp ảnh hoặc chọn ảnh từ Album!");
        return;
      }
      if (selectedRecipients.size === 0) {
        alert("Vui lòng chọn ít nhất 1 người bạn để gửi!");
        return;
      }

      const statusPill = document.getElementById('cameraStatusPill');
      statusPill.innerText = "Đang tải lên khoảnh khắc...";
      statusPill.classList.remove('hidden');

      const formData = new FormData();
      formData.append('file', capturedBlob, isVideoMedia ? 'moment.mp4' : 'moment.jpg');
      formData.append('caption', document.getElementById('cameraCaptionInput').value.trim());
      formData.append('recipients', JSON.stringify(Array.from(selectedRecipients)));
      formData.append('weather_overlay', weatherOverlayActive);
      formData.append('frame_type', selectedFrame);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          statusPill.innerText = "Gửi khoảnh khắc thành công!";
          setTimeout(() => {
            statusPill.classList.add('hidden');
            cancelCapturedMedia();
            switchMainTab('feed');
            loadFeed();
          }, 1000);
        } else {
          statusPill.innerText = "Lỗi: " + (data.error || "Không gửi được");
        }
      } catch (e) {
        statusPill.innerText = "Lỗi kết nối máy chủ!";
      }
    }

    // ==========================================
    // 5. FEED / KHOẢNH KHẮC ENGINE (MATCHING IMAGE 3)
    // ==========================================
    async function loadFeed() {
      try {
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allMomentsList = data.moments || [];
        renderFeedFilterChips();
        renderFeedMoments();
      } catch (err) {
        console.warn('Load feed error:', err);
      }
    }

    function renderFeedFilterChips() {
      const row = document.getElementById('feedFriendsFilterRow');
      let html = `
        <button onclick="filterFeedByFriend(null)" class="px-3.5 py-1.5 rounded-full text-xs font-bold transition-all shrink-0 ${activeFeedFilterUid === null ? 'bg-amber-400 text-black shadow-md' : 'glass-pill text-slate-300'}">
          Tất cả
        </button>
      `;
      allFriendsList.forEach(f => {
        const active = activeFeedFilterUid === f.uid;
        html += `
          <button onclick="filterFeedByFriend('${f.uid}')" class="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold transition-all shrink-0 ${active ? 'bg-amber-400 text-black shadow-md' : 'glass-pill text-slate-300'}">
            ${f.profile_picture ? `<img src="${f.profile_picture}" class="w-4 h-4 rounded-full object-cover">` : ''}
            <span>${f.first_name || f.username}</span>
          </button>
        `;
      });
      row.innerHTML = html;
    }

    function filterFeedByFriend(uid) {
      activeFeedFilterUid = uid;
      renderFeedFilterChips();
      renderFeedMoments();
    }

    function renderFeedMoments() {
      const container = document.getElementById('feedMomentsList');
      let filtered = allMomentsList;
      if (activeFeedFilterUid) {
        filtered = allMomentsList.filter(m => m.user === activeFeedFilterUid || (m.author && m.author.uid === activeFeedFilterUid));
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 space-y-2">
            <i data-lucide="camera-off" class="w-12 h-12 text-slate-600 mx-auto"></i>
            <p class="text-sm font-bold text-slate-400">Chưa có khoảnh khắc nào</p>
            <p class="text-xs text-slate-500">Hãy là người đầu tiên chụp và gửi cho bạn bè!</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map(m => {
        const author = m.author || {};
        const authorName = author.first_name ? `${author.first_name} ${author.last_name || ''}`.trim() : (author.username || 'Bạn bè');
        const authorUser = author.username ? `@${author.username}` : '';
        const timeAgo = formatTimeAgo(m.date);
        const isVideo = m.video_url || (m.thumbnail_url && m.thumbnail_url.includes('video'));
        const mediaSrc = m.video_url || m.thumbnail_url;

        return `
          <!-- MOMENT CARD (EXACTLY AS IN IMAGE 3) -->
          <div class="w-full max-w-[360px] flex flex-col space-y-2.5">
            
            <!-- Author Header -->
            <div class="flex items-center justify-between px-1">
              <div class="flex items-center gap-2.5 cursor-pointer" onclick="openDirectChatFromMoment('${author.uid || ''}', '${authorName}', '${authorUser}', '${author.profile_picture || ''}')">
                <div class="relative w-9 h-9 rounded-full ring-2 ring-amber-400/40 p-0.5 overflow-hidden">
                  ${author.profile_picture ? 
                    `<img src="${author.profile_picture}" class="w-full h-full rounded-full object-cover">` : 
                    `<div class="w-full h-full rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-white">${authorName[0]}</div>`
                  }
                </div>
                <div>
                  <div class="text-xs font-bold text-white flex items-center gap-1">
                    <span>${authorName}</span>
                  </div>
                  <div class="text-[10px] text-slate-400">${authorUser} • ${timeAgo}</div>
                </div>
              </div>
            </div>

            <!-- Squircle Media Container -->
            <div class="locket-squircle relative mx-auto shadow-2xl">
              ${isVideo ? 
                `<video src="${mediaSrc}" autoplay loop muted playsinline class="w-full h-full object-cover"></video>` : 
                `<img src="${mediaSrc}" loading="lazy" class="w-full h-full object-cover" alt="Moment">`
              }
              <!-- Caption if present -->
              ${m.caption ? `
                <div class="absolute bottom-4 left-4 right-4 bg-black/65 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-white/10 text-center shadow-lg">
                  <span class="text-xs font-semibold text-white">${m.caption}</span>
                </div>
              ` : ''}
            </div>

            <!-- Reactions Bar (IMAGE 3) -->
            <div class="flex items-center justify-between px-1 pt-0.5">
              <div class="flex items-center gap-2.5 glass-pill px-3 py-1.5 rounded-full">
                <button onclick="sendMomentReaction(event, '${m.id}', '❤️')" class="text-lg hover:scale-125 active:scale-75 transition-all">❤️</button>
                <button onclick="sendMomentReaction(event, '${m.id}', '🔥')" class="text-lg hover:scale-125 active:scale-75 transition-all">🔥</button>
                <button onclick="sendMomentReaction(event, '${m.id}', '😂')" class="text-lg hover:scale-125 active:scale-75 transition-all">😂</button>
                <button onclick="sendMomentReaction(event, '${m.id}', '🥺')" class="text-lg hover:scale-125 active:scale-75 transition-all">🥺</button>
                <button onclick="sendMomentReaction(event, '${m.id}', '👏')" class="text-lg hover:scale-125 active:scale-75 transition-all">👏</button>
              </div>

              <!-- Button "Nhắn tin" (IMAGE 3) -->
              <button onclick="openDirectChatFromMoment('${author.uid || ''}', '${authorName}', '${authorUser}', '${author.profile_picture || ''}')" class="flex items-center gap-1.5 glass-pill px-3.5 py-2 rounded-full text-xs font-bold text-slate-200 active:scale-95 transition-all hover:border-amber-400/40">
                <i data-lucide="message-circle" class="w-4 h-4 text-slate-300"></i>
                <span>Nhắn tin</span>
              </button>
            </div>

          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function sendMomentReaction(event, momentId, emoji) {
      // Create floating reaction particle animation
      const btn = event.currentTarget;
      const rect = btn.getBoundingClientRect();
      const el = document.createElement('div');
      el.className = 'floating-reaction text-2xl';
      el.innerText = emoji;
      el.style.left = `${rect.left + rect.width / 4}px`;
      el.style.top = `${rect.top}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    // ==========================================
    // 6. CHAT & CONVERSATIONS ENGINE (MATCHING IMAGE 4)
    // ==========================================
    async function loadChatConversations() {
      const container = document.getElementById('chatConversationsContainer');
      container.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">Đang tải cuộc trò chuyện...</div>';
      try {
        const res = await fetch('/api/chat/conversations');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allConversationsList = data.conversations || [];
        document.getElementById('chatConversationsCount').innerText = `${allConversationsList.length} cuộc trò chuyện`;
        renderChatConversations(allConversationsList);
      } catch (err) {
        container.innerHTML = '<div class="text-xs text-rose-400 py-8 text-center">Lỗi tải tin nhắn. Vui lòng thử lại sau!</div>';
      }
    }

    function renderChatConversations(conversations) {
      const container = document.getElementById('chatConversationsContainer');
      if (conversations.length === 0) {
        container.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">Chưa có cuộc trò chuyện nào.</div>';
        return;
      }
      container.innerHTML = conversations.map(c => {
        const peer = c.peer || {};
        const peerName = peer.first_name ? `${peer.first_name} ${peer.last_name || ''}`.trim() : (peer.username || 'Bạn bè');
        const lastMsg = c.last_message || 'Khoảnh khắc mới';

        return `
          <!-- Conversation Item (IMAGE 4) -->
          <div onclick="openDirectChatFromMoment('${peer.uid || ''}', '${peerName}', '${peer.username || ''}', '${peer.profile_picture || ''}', '${c.conversation_id || ''}')" class="flex items-center justify-between p-3.5 rounded-2xl glass-pill cursor-pointer hover:bg-white/[0.08] active:scale-[0.99] transition-all">
            <div class="flex items-center gap-3">
              <div class="relative w-11 h-11 rounded-full p-0.5 ring-2 ring-amber-400/30 overflow-hidden shrink-0">
                ${peer.profile_picture ? 
                  `<img src="${peer.profile_picture}" class="w-full h-full rounded-full object-cover">` : 
                  `<div class="w-full h-full rounded-full bg-slate-700 flex items-center justify-center font-bold text-sm text-white">${peerName[0]}</div>`
                }
              </div>
              <div class="flex flex-col">
                <span class="text-xs font-bold text-white">${peerName}</span>
                <span class="text-[11px] text-slate-400 line-clamp-1">${lastMsg}</span>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function filterChatConversations() {
      const q = document.getElementById('chatSearchInput').value.toLowerCase().trim();
      if (!q) {
        renderChatConversations(allConversationsList);
        return;
      }
      const filtered = allConversationsList.filter(c => {
        const name = (c.peer.first_name + ' ' + (c.peer.last_name || '')).toLowerCase();
        const user = (c.peer.username || '').toLowerCase();
        const msg = (c.last_message || '').toLowerCase();
        return name.includes(q) || user.includes(q) || msg.includes(q);
      });
      renderChatConversations(filtered);
    }

    // ==========================================
    // 7. DIRECT 1-ON-1 CHAT ROOM (IMAGE 5 SCREEN 1)
    // ==========================================
    let currentConversationId = null;

    async function openDirectChatFromMoment(peerUid, peerName, peerUsername, peerAvatar, convId = null) {
      activeDirectChatPeerUid = peerUid;
      currentConversationId = convId;

      document.getElementById('directChatPeerName').innerText = peerName || 'Bạn bè';
      document.getElementById('directChatPeerUsername').innerText = peerUsername ? `@${peerUsername}` : '';
      const avatarEl = document.getElementById('directChatPeerAvatar');
      if (peerAvatar) {
        avatarEl.innerHTML = `<img src="${peerAvatar}" class="w-full h-full object-cover">`;
      } else {
        avatarEl.innerHTML = (peerName || 'U')[0];
      }

      document.getElementById('viewDirectChat').classList.remove('hidden');
      await loadDirectChatMessages();
    }

    function closeDirectChat() {
      document.getElementById('viewDirectChat').classList.add('hidden');
      activeDirectChatPeerUid = null;
      currentConversationId = null;
    }

    async function loadDirectChatMessages() {
      const container = document.getElementById('directChatMessagesContainer');
      container.innerHTML = '<div class="text-xs text-slate-400 py-6 text-center">Đang tải tin nhắn...</div>';
      try {
        let url = `/api/chat/messages?`;
        if (currentConversationId) url += `conversation_id=${encodeURIComponent(currentConversationId)}`;
        else if (activeDirectChatPeerUid) url += `uid=${encodeURIComponent(activeDirectChatPeerUid)}`;

        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const messages = data.messages || [];
        const myUid = data.my_uid;

        if (messages.length === 0) {
          container.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">Bắt đầu trò chuyện bằng cách gửi tin nhắn hoặc khoảnh khắc!</div>';
          return;
        }

        container.innerHTML = messages.map(m => {
          const isMe = m.is_me || m.sender_uid === myUid;
          return `
            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
              <div class="max-w-[78%] px-3.5 py-2.5 rounded-2xl text-xs ${isMe ? 'bg-amber-400 text-black font-semibold rounded-br-none shadow-md' : 'bg-[#22222c] text-white rounded-bl-none border border-white/10'}">
                ${m.text}
              </div>
              <span class="text-[9px] text-slate-500 mt-1 px-1">${formatTimeAgo(m.timestamp)}</span>
            </div>
          `;
        }).join('');
        container.scrollTop = container.scrollHeight;
      } catch (err) {
        container.innerHTML = '<div class="text-xs text-rose-400 py-4 text-center">Lỗi tải tin nhắn.</div>';
      }
    }

    async function sendDirectChatMessage() {
      const input = document.getElementById('directChatMessageInput');
      const text = input.value.trim();
      if (!text || !activeDirectChatPeerUid) return;

      input.value = '';
      try {
        const res = await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to_uid: activeDirectChatPeerUid,
            text: text
          })
        });
        await loadDirectChatMessages();
      } catch (err) {
        console.warn('Send chat message error:', err);
      }
    }

    function sendQuickEmoji(emoji) {
      const input = document.getElementById('directChatMessageInput');
      input.value += emoji;
      sendDirectChatMessage();
    }

    function replyWithCameraFromChat() {
      const targetUid = activeDirectChatPeerUid;
      closeDirectChat();
      switchMainTab('camera');
      if (targetUid) {
        selectedRecipients.clear();
        selectedRecipients.add(targetUid);
      }
    }

    // ==========================================
    // 8. FRIENDS & SETTINGS MODALS
    // ==========================================
    async function loadFriends() {
      try {
        const res = await fetch('/api/friends');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allFriendsList = data.friends || [];
        document.getElementById('friendsHeaderLabel').innerText = `${allFriendsList.length} Bạn bè`;
        document.getElementById('friendsModalTitle').innerText = `${allFriendsList.length} Bạn bè`;
      } catch (err) {
        console.warn('Load friends error:', err);
      }
    }

    function openFriendsModal() {
      document.getElementById('friendsModal').classList.remove('hidden');
      renderModalFriendsList(allFriendsList);
    }

    function closeFriendsModal() {
      document.getElementById('friendsModal').classList.add('hidden');
    }

    function renderModalFriendsList(friends) {
      const container = document.getElementById('friendsListModalContainer');
      container.innerHTML = friends.map(f => {
        const name = `${f.first_name || ''} ${f.last_name || ''}`.trim() || f.username;
        return `
          <div class="flex items-center justify-between p-2.5 rounded-2xl glass-pill">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full p-0.5 ring-2 ring-amber-400/40 overflow-hidden shrink-0">
                ${f.profile_picture ? `<img src="${f.profile_picture}" class="w-full h-full rounded-full object-cover">` : `<div class="w-full h-full rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-white">${name[0]}</div>`}
              </div>
              <div>
                <div class="text-xs font-bold text-white">${name}</div>
                <div class="text-[10px] text-slate-400">@${f.username || 'user'}</div>
              </div>
            </div>
            <button onclick="openDirectChatFromMoment('${f.uid}', '${name}', '${f.username}', '${f.profile_picture || ''}'); closeFriendsModal();" class="p-2 rounded-xl bg-white/10 text-white active:scale-90">
              <i data-lucide="message-circle" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function filterModalFriends() {
      const q = document.getElementById('friendSearchModalInput').value.toLowerCase().trim();
      if (!q) {
        renderModalFriendsList(allFriendsList);
        return;
      }
      const filtered = allFriendsList.filter(f => {
        const name = (f.first_name + ' ' + (f.last_name || '')).toLowerCase();
        const user = (f.username || '').toLowerCase();
        return name.includes(q) || user.includes(q);
      });
      renderModalFriendsList(filtered);
    }

    function openSettingsModal() {
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function logoutSession() {
      if (confirm("Bạn có chắc chắn muốn đăng xuất khỏi Locket?")) {
        window.location.reload();
      }
    }

    // ==========================================
    // 9. WEATHER & FRAME SERVICES
    // ==========================================
    async function fetchWeatherData() {
      try {
        const res = await fetch('/api/weather');
        if (!res.ok) return;
        const data = await res.json();
        weatherData = data;
        document.getElementById('liveWeatherIcon').innerText = data.icon || '🌧️';
        document.getElementById('liveWeatherTemp').innerText = `${data.temp}°C`;
        document.getElementById('liveWeatherCity').innerText = data.city || 'TP.HCM';
      } catch (err) {
        console.warn('Weather error:', err);
      }
    }

    function toggleWeatherRadar() {
      weatherOverlayActive = !weatherOverlayActive;
      const badge = document.getElementById('liveWeatherBadge');
      if (weatherOverlayActive) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function cycleFrameType() {
      const frames = ['none', 'polaroid', 'cinema'];
      const idx = (frames.indexOf(selectedFrame) + 1) % frames.length;
      selectedFrame = frames[idx];
      alert(`Đã đổi kiểu khung hình: ${selectedFrame.toUpperCase()}`);
    }

    // Helpers
    function formatTimeAgo(dateStr) {
      if (!dateStr) return 'vừa xong';
      const d = new Date(dateStr);
      const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diffSec < 60) return 'vừa xong';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin} phút trước`;
      const diffHours = Math.floor(diffMin / 60);
      if (diffHours < 24) return `${diffHours} giờ trước`;
      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays} ngày trước`;
    }

    // ==========================================
    // 10. GESTURE ENGINE (REACT NATIVE PANRESPONDER EQUIVALENT)
    // ==========================================
    let touchStartY = 0;
    let touchStartX = 0;
    let lastTapTime = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length === 1) {
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.changedTouches && e.changedTouches.length === 1) {
        const dy = e.changedTouches[0].clientY - touchStartY;
        const dx = e.changedTouches[0].clientX - touchStartX;

        // Kích hoạt khi vuốt dọc rõ ràng (> 50px)
        if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 50) {
          // Vuốt XUỐNG ở màn hình Camera -> Mở Feed / Lịch sử (PanResponder swipe down)
          if (activeTab === 'camera' && dy > 50 && !isPostCaptureState) {
            switchMainTab('feed');
          }
          // Vuốt LÊN ở màn hình Feed (khi cuộn ở đầu trang) -> Về Camera (PanResponder swipe up)
          else if (activeTab === 'feed' && dy < -50) {
            const feedEl = document.getElementById('viewFeed');
            if (feedEl && feedEl.scrollTop <= 20) {
              switchMainTab('camera');
            }
          }
        }
      }
    }, { passive: true });

    // Double-tap trên khung camera để đổi chiều trước/sau
    const cameraSquircleEl = document.getElementById('cameraSquircle');
    if (cameraSquircleEl) {
      cameraSquircleEl.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTapTime < 320) {
          flipCameraOrientation();
        }
        lastTapTime = now;
      });
    }
  </script>
</body>
</html>
