<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Locket</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Locket">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
    
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000000;
      color: #ffffff;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .locket-frame {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius: 46px;
      overflow: hidden;
      position: relative;
      background: #111116;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .glass-pill {
      background: rgba(30, 30, 38, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Shutter flash animation */
    @keyframes shutterFlash {
      0% { opacity: 0; }
      50% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-effect {
      animation: shutterFlash 0.25s ease-out;
    }
  </style>
</head>
<body class="flex flex-col justify-between max-w-md mx-auto h-full relative">

  <!-- Fullscreen Camera Flash Overlay -->
  <div id="flashOverlay" class="fixed inset-0 bg-white pointer-events-none z-50 opacity-0"></div>

  <!-- ======================================================== -->
  <!-- TOP APP HEADER -->
  <!-- ======================================================== -->
  <header class="flex items-center justify-between px-5 pt-3 pb-2 z-30">
    <!-- Left: Friends selector / count -->
    <button onclick="openFriendsModal()" class="flex items-center gap-2 glass-pill px-3 py-1.5 rounded-full text-xs font-semibold text-slate-200 active:scale-95 transition-all">
      <div id="headerUserAvatar" class="w-5 h-5 rounded-full bg-gradient-to-tr from-pink-500 to-amber-500 flex items-center justify-center text-[10px] font-bold text-white">
        L
      </div>
      <span id="headerFriendsText">32 Bạn bè</span>
      <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400"></i>
    </button>

    <!-- Center: App Logo (Click to switch to Camera) -->
    <div class="flex items-center gap-1.5 cursor-pointer" onclick="switchToCameraMode()">
      <div class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></div>
      <span class="font-extrabold text-base tracking-wide bg-gradient-to-r from-amber-300 via-pink-400 to-amber-200 bg-clip-text text-transparent">LOCKET</span>
    </div>

    <!-- Right: Chat Messages Button -->
    <button onclick="switchMainView('chat')" class="relative glass-pill w-9 h-9 rounded-full flex items-center justify-center text-slate-200 active:scale-95 transition-all">
      <i data-lucide="message-circle" class="w-4 h-4"></i>
      <span id="unreadChatBadge" class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-pink-500 rounded-full border-2 border-black hidden"></span>
    </button>
  </header>

  <!-- ======================================================== -->
  <!-- MAIN CONTENT CONTAINER -->
  <!-- ======================================================== -->
  <main class="flex-1 relative overflow-hidden flex flex-col items-center justify-center px-4">

    <!-- VIEW 1: CAMERA & POST STUDIO (TRANG CHỦ LOCKET) -->
    <div id="viewCamera" class="w-full flex flex-col items-center justify-center space-y-4">
      
      <!-- Locket Square Viewport -->
      <div class="locket-frame relative flex items-center justify-center">
        <!-- 1. REAL LIVE CAMERA VIDEO FEED (Bật lên là camera thật hoạt động) -->
        <video id="cameraLiveStream" autoplay playsinline muted class="w-full h-full object-cover"></video>

        <!-- 2. Captured Image or Picked Photo Element -->
        <img id="cameraPreviewImage" class="w-full h-full object-cover hidden" alt="Captured Photo">

        <!-- 3. Picked Long Video Element (2 - 5 min video) -->
        <video id="cameraPreviewVideo" autoplay loop muted playsinline class="w-full h-full object-cover hidden"></video>

        <!-- Retake / Cancel Button (X) when media is captured or picked -->
        <button id="btnRetakeMedia" onclick="cancelCapturedMedia()" class="hidden absolute top-4 left-4 z-20 glass-pill w-9 h-9 rounded-full flex items-center justify-center text-white active:scale-90 transition-all shadow-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <!-- Flip Camera Button (Only visible during live camera mode) -->
        <button id="btnFlipCamera" onclick="flipCameraOrientation()" class="absolute top-4 right-4 z-20 glass-pill w-9 h-9 rounded-full flex items-center justify-center text-white active:scale-90 transition-all shadow-lg" title="Lật camera trước/sau">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>

        <!-- Quick Toolbar inside frame (Weather & Frame toggles) -->
        <div id="frameQuickToolbar" class="absolute bottom-4 right-4 flex items-center gap-2 z-20">
          <button onclick="toggleWeatherRadar()" id="btnWeatherToggle" class="glass-pill w-8 h-8 rounded-full flex items-center justify-center text-slate-400 active:scale-95 transition-all shadow-lg" title="Bật/Tắt Card Thời tiết & Radar">
            <i data-lucide="cloud-rain" class="w-4 h-4"></i>
          </button>
          <button onclick="cycleFrameType()" id="btnFrameCycle" class="glass-pill w-8 h-8 rounded-full flex items-center justify-center text-slate-400 active:scale-95 transition-all shadow-lg" title="Đổi khung ảnh">
            <i data-lucide="crop" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- Custom Caption Tag Overlay on Moment -->
        <div id="cameraCaptionTag" class="hidden absolute bottom-4 left-4 right-4 bg-black/60 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-white/10 flex items-center justify-center text-center z-10">
          <span id="cameraCaptionText" class="text-xs font-semibold text-white"></span>
        </div>
      </div>

      <!-- Quick Caption Input bar -->
      <div class="w-full max-w-[360px] flex items-center gap-2 glass-pill px-4 py-2.5 rounded-2xl">
        <input type="text" id="cameraCaptionInput" placeholder="Viết chú thích cho khoảnh khắc..." class="flex-1 bg-transparent text-xs text-white placeholder-slate-400 focus:outline-none" oninput="handleCaptionInput()">
        <button onclick="openColorPalette()" class="text-xs text-amber-400 hover:text-amber-300 font-medium">Màu sắc</button>
      </div>

      <!-- Secret file input for gallery picker -->
      <input type="file" id="inputMediaFile" accept="image/*,video/*" class="hidden" onchange="handleMediaSelected(event)">

      <!-- Media Info & Status pill -->
      <div id="cameraStatusPill" class="hidden text-[11px] font-medium text-amber-300 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-center"></div>

    </div>

    <!-- VIEW 2: FEED / DÒNG THỜI GIAN (XEM BẠN BÈ ĐĂNG GÌ) -->
    <div id="viewFeed" class="w-full h-full flex flex-col items-center justify-center hidden">
      <div id="feedContainer" class="w-full flex flex-col items-center justify-center">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- VIEW 3: TIN NHẮN & CHAT -->
    <div id="viewChat" class="w-full h-full flex flex-col hidden pt-2">
      <!-- Conversation List Subview -->
      <div id="chatListView" class="w-full h-full flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-2">
          <h2 class="text-base font-bold text-white flex items-center gap-2">
            <i data-lucide="messages-square" class="w-4 h-4 text-pink-400"></i> Tin nhắn Locket
          </h2>
          <span id="chatCountText" class="text-xs text-slate-400 font-mono">27 cuộc trò chuyện</span>
        </div>

        <div id="chatConversationsContainer" class="flex-1 overflow-y-auto space-y-2 no-scrollbar pr-1">
          <!-- Loaded dynamically -->
          <div class="text-xs text-slate-500 py-8 text-center">Đang tải tin nhắn...</div>
        </div>
      </div>

      <!-- Active 1-on-1 Chat Subview -->
      <div id="chatDirectView" class="w-full h-full flex flex-col hidden">
        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-2">
          <div class="flex items-center gap-3">
            <button onclick="closeDirectChat()" class="p-1 rounded-lg hover:bg-white/10 text-slate-300">
              <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <div id="chatActivePeerAvatar" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white">U</div>
            <div>
              <div id="chatActivePeerName" class="text-xs font-bold text-white">Bạn bè</div>
              <div id="chatActivePeerUsername" class="text-[10px] text-slate-400">@username</div>
            </div>
          </div>
        </div>

        <!-- Chat messages history -->
        <div id="chatMessagesContainer" class="flex-1 overflow-y-auto space-y-2.5 p-2 no-scrollbar">
          <!-- Dynamically loaded messages -->
        </div>

        <!-- Chat input bar -->
        <div class="flex items-center gap-2 glass-pill p-2 rounded-2xl mt-2">
          <input type="text" id="chatMessageInput" placeholder="Nhắn tin cho bạn bè..." class="flex-1 bg-transparent text-xs text-white placeholder-slate-400 focus:outline-none px-2" onkeydown="if(event.key==='Enter') sendChatMessage()">
          <button onclick="sendChatMessage()" class="w-8 h-8 rounded-xl bg-pink-500 flex items-center justify-center text-white active:scale-95 transition-all">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- ======================================================== -->
  <!-- BOTTOM CONTROLS & CAMERA SHUTTER BUTTON -->
  <!-- ======================================================== -->
  <footer class="w-full pb-6 pt-3 px-6 z-30">
    <!-- Camera mode controls -->
    <div id="cameraControlsFooter" class="flex items-center justify-between max-w-[340px] mx-auto">
      
      <!-- Gallery Picker Button (Opens Phone Camera Roll / Gallery) -->
      <button onclick="document.getElementById('inputMediaFile').click()" class="glass-pill w-12 h-12 rounded-full flex items-center justify-center text-white active:scale-90 transition-all shadow-lg" title="Chọn ảnh hoặc video từ thư viện máy">
        <i data-lucide="image" class="w-5 h-5 text-amber-300"></i>
      </button>

      <!-- Center Big Shutter Button (Capture photo or Send moment) -->
      <div class="relative flex items-center justify-center">
        <div class="w-20 h-20 rounded-full border-4 border-white/80 flex items-center justify-center p-1">
          <button id="btnShutterAction" onclick="handleShutterClick()" class="w-full h-full rounded-full bg-amber-400 active:scale-90 transition-all shadow-xl shadow-amber-400/20 flex items-center justify-center text-black">
            <!-- Icon switches between empty (camera capture mode) and send icon (when media is ready) -->
            <i id="btnShutterIcon" data-lucide="send" class="w-7 h-7 text-black hidden"></i>
          </button>
        </div>
      </div>

      <!-- Feed / History Button (Xem bạn bè đăng gì) -->
      <button onclick="switchMainView('feed')" class="glass-pill w-12 h-12 rounded-full flex items-center justify-center text-white active:scale-90 transition-all shadow-lg" title="Xem bạn bè đăng gì">
        <i data-lucide="sparkles" class="w-5 h-5 text-pink-400"></i>
      </button>

    </div>

    <!-- Feed / Chat Bottom Navigation Bar -->
    <div id="navFooter" class="hidden flex items-center justify-around max-w-[280px] mx-auto glass-pill py-2.5 px-4 rounded-full">
      <button onclick="switchToCameraMode()" class="text-slate-400 hover:text-white flex flex-col items-center">
        <i data-lucide="camera" class="w-5 h-5"></i>
      </button>
      <button onclick="switchMainView('feed')" class="text-pink-400 flex flex-col items-center">
        <i data-lucide="sparkles" class="w-5 h-5"></i>
      </button>
      <button onclick="switchMainView('chat')" class="text-slate-400 hover:text-white flex flex-col items-center">
        <i data-lucide="message-circle" class="w-5 h-5"></i>
      </button>
    </div>
  </footer>

  <!-- ======================================================== -->
  <!-- FRIENDS SELECTION MODAL -->
  <!-- ======================================================== -->
  <div id="friendsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col justify-end hidden">
    <div class="bg-[#121218] border-t border-white/10 rounded-t-[36px] max-h-[80vh] flex flex-col p-6">
      <div class="flex items-center justify-between pb-4 border-b border-white/10">
        <div>
          <h3 class="text-base font-bold text-white">Bạn bè Locket (32)</h3>
          <p class="text-xs text-slate-400">Chọn người bạn muốn gửi khoảnh khắc đến</p>
        </div>
        <button onclick="closeFriendsModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div id="modalFriendsList" class="flex-1 overflow-y-auto space-y-2 py-4 no-scrollbar">
        <!-- Dynamically filled -->
      </div>

      <button onclick="closeFriendsModal()" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-amber-500 rounded-2xl font-bold text-sm text-white shadow-lg">
        Xong
      </button>
    </div>
  </div>

  <!-- Hidden in-memory canvas for camera snapshot capture -->
  <canvas id="cameraCanvas" class="hidden" width="1080" height="1080"></canvas>

  <script>
    // State
    let currentView = 'camera';
    let isLiveCamera = true;
    let cameraStream = null;
    let facingMode = 'user'; // 'user' (selfie) or 'environment' (back camera)
    let selectedFile = null;
    let isVideoFile = false;
    let weatherEnabled = false;
    let currentFrame = 'none';
    let friendsList = [];
    let selectedFriendUids = [];
    let currentFeed = [];
    let activeChatPeerUid = null;

    lucide.createIcons();

    // ==========================================
    // REAL LIVE CAMERA ENGINE (BẬT CAMERA THẬT)
    // ==========================================
    async function startLiveCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        console.warn('Camera API not available');
        return;
      }

      try {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
          video: {
            facingMode: facingMode,
            width: { ideal: 1080 },
            height: { ideal: 1080 },
            aspectRatio: 1
          },
          audio: false
        };

        cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
        const liveVideo = document.getElementById('cameraLiveStream');
        liveVideo.srcObject = cameraStream;
        await liveVideo.play();

        isLiveCamera = true;
        document.getElementById('cameraLiveStream').classList.remove('hidden');
        document.getElementById('cameraPreviewImage').classList.add('hidden');
        document.getElementById('cameraPreviewVideo').classList.add('hidden');
        document.getElementById('btnRetakeMedia').classList.add('hidden');
        document.getElementById('btnFlipCamera').classList.remove('hidden');
        document.getElementById('btnShutterIcon').classList.add('hidden');
        document.getElementById('cameraStatusPill').classList.add('hidden');
      } catch (err) {
        console.warn('Camera permission or device error:', err);
      }
    }

    function stopLiveCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    function flipCameraOrientation() {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      startLiveCamera();
    }

    // Capture Real Photo from Live Camera
    function capturePhotoFromCamera() {
      const liveVideo = document.getElementById('cameraLiveStream');
      const canvas = document.getElementById('cameraCanvas');
      const ctx = canvas.getContext('2d');

      // Flash animation
      const flash = document.getElementById('flashOverlay');
      flash.classList.add('flash-effect');
      setTimeout(() => flash.classList.remove('flash-effect'), 250);

      // Draw square video frame to 1080x1080 canvas
      const minDim = Math.min(liveVideo.videoWidth || 1080, liveVideo.videoHeight || 1080);
      const startX = ((liveVideo.videoWidth || 1080) - minDim) / 2;
      const startY = ((liveVideo.videoHeight || 1080) - minDim) / 2;

      ctx.save();
      // Mirror selfie camera
      if (facingMode === 'user') {
        ctx.translate(1080, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(liveVideo, startX, startY, minDim, minDim, 0, 0, 1080, 1080);
      ctx.restore();

      canvas.toBlob(blob => {
        selectedFile = new File([blob], `locket_snap_${Date.now()}.png`, { type: 'image/png' });
        isVideoFile = false;
        isLiveCamera = false;

        stopLiveCamera();

        document.getElementById('cameraLiveStream').classList.add('hidden');
        document.getElementById('cameraPreviewImage').classList.remove('hidden');
        document.getElementById('cameraPreviewVideo').classList.add('hidden');
        document.getElementById('btnRetakeMedia').classList.remove('hidden');
        document.getElementById('btnFlipCamera').classList.add('hidden');
        document.getElementById('btnShutterIcon').classList.remove('hidden');

        renderImagePreview();
        lucide.createIcons();
      }, 'image/png');
    }

    function cancelCapturedMedia() {
      selectedFile = null;
      isVideoFile = false;
      document.getElementById('cameraCaptionInput').value = '';
      document.getElementById('cameraCaptionTag').classList.add('hidden');
      document.getElementById('cameraPreviewVideo').pause();
      startLiveCamera();
      lucide.createIcons();
    }

    // Shutter Button Action: Capture Photo or Post Moment
    function handleShutterClick() {
      if (isLiveCamera && !selectedFile) {
        // Step 1: Capture photo from live camera
        capturePhotoFromCamera();
      } else {
        // Step 2: Media is ready -> Post Moment to Locket!
        postMomentToServer();
      }
    }

    // Switch Views
    function switchToCameraMode() {
      switchMainView('camera');
      if (!selectedFile) {
        startLiveCamera();
      }
    }

    function switchMainView(view) {
      currentView = view;
      document.getElementById('viewCamera').classList.toggle('hidden', view !== 'camera');
      document.getElementById('viewFeed').classList.toggle('hidden', view !== 'feed');
      document.getElementById('viewChat').classList.toggle('hidden', view !== 'chat');

      document.getElementById('cameraControlsFooter').classList.toggle('hidden', view !== 'camera');
      document.getElementById('navFooter').classList.toggle('hidden', view === 'camera');

      if (view === 'camera') {
        if (!selectedFile) startLiveCamera();
      } else {
        stopLiveCamera();
      }

      if (view === 'feed') {
        loadFeed();
      } else if (view === 'chat') {
        loadConversations();
      }
      lucide.createIcons();
    }

    // Media Selected from Phone Gallery
    function handleMediaSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      selectedFile = file;
      isVideoFile = file.type.startsWith('video');
      isLiveCamera = false;
      stopLiveCamera();

      document.getElementById('cameraLiveStream').classList.add('hidden');
      document.getElementById('btnFlipCamera').classList.add('hidden');
      document.getElementById('btnRetakeMedia').classList.remove('hidden');
      document.getElementById('btnShutterIcon').classList.remove('hidden');

      const imgElem = document.getElementById('cameraPreviewImage');
      const videoElem = document.getElementById('cameraPreviewVideo');
      const statusPill = document.getElementById('cameraStatusPill');

      if (isVideoFile) {
        imgElem.classList.add('hidden');
        videoElem.classList.remove('hidden');
        videoElem.src = URL.createObjectURL(file);
        videoElem.play().catch(e => console.log(e));

        const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
        statusPill.classList.remove('hidden');
        statusPill.innerText = `🎬 Video ${sizeMb} MB • Tự động nén chuẩn Universal H.264/HEVC <6MB`;
      } else {
        videoElem.classList.add('hidden');
        videoElem.pause();
        imgElem.classList.remove('hidden');
        statusPill.classList.add('hidden');
        imgElem.src = URL.createObjectURL(file);
        renderImagePreview();
      }
      lucide.createIcons();
    }

    function handleCaptionInput() {
      const val = document.getElementById('cameraCaptionInput').value.trim();
      const tag = document.getElementById('cameraCaptionTag');
      const text = document.getElementById('cameraCaptionText');
      if (val) {
        tag.classList.remove('hidden');
        text.innerText = val;
      } else {
        tag.classList.add('hidden');
      }
    }

    function toggleWeatherRadar() {
      weatherEnabled = !weatherEnabled;
      const btn = document.getElementById('btnWeatherToggle');
      btn.className = weatherEnabled 
        ? 'glass-pill w-8 h-8 rounded-full flex items-center justify-center text-cyan-400 bg-cyan-500/20 border-cyan-400/50 active:scale-95 transition-all shadow-lg'
        : 'glass-pill w-8 h-8 rounded-full flex items-center justify-center text-slate-400 active:scale-95 transition-all shadow-lg';
      if (!isVideoFile && selectedFile) renderImagePreview();
    }

    function cycleFrameType() {
      const frames = ['none', 'retro_cam', 'polaroid', 'glass_frost'];
      const nextIndex = (frames.indexOf(currentFrame) + 1) % frames.length;
      currentFrame = frames[nextIndex];
      const btn = document.getElementById('btnFrameCycle');
      btn.className = currentFrame !== 'none'
        ? 'glass-pill w-8 h-8 rounded-full flex items-center justify-center text-pink-400 bg-pink-500/20 border-pink-400/50 active:scale-95 transition-all shadow-lg'
        : 'glass-pill w-8 h-8 rounded-full flex items-center justify-center text-slate-400 active:scale-95 transition-all shadow-lg';
      if (!isVideoFile && selectedFile) renderImagePreview();
    }

    async function renderImagePreview() {
      if (!selectedFile || isVideoFile) return;
      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('frame_type', currentFrame);
      formData.append('weather_enabled', weatherEnabled ? 'true' : 'false');
      formData.append('weather_style', 'pill');
      formData.append('weather_pos', 'top_left');
      formData.append('weather_city', 'TP. Hồ Chí Minh');
      formData.append('caption', document.getElementById('cameraCaptionInput').value.trim());

      try {
        const res = await fetch('/api/preview', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success && data.preview_url) {
          document.getElementById('cameraPreviewImage').src = data.preview_url;
        }
      } catch (e) {
        console.error(e);
      }
    }

    // Post Moment to Locket Server
    async function postMomentToServer() {
      const shutterBtn = document.getElementById('btnShutterAction');
      const statusPill = document.getElementById('cameraStatusPill');

      shutterBtn.disabled = true;
      shutterBtn.innerHTML = `<i data-lucide="loader" class="w-6 h-6 animate-spin text-black"></i>`;
      lucide.createIcons();

      statusPill.classList.remove('hidden');
      statusPill.innerText = isVideoFile ? 'Đang nén video và gửi lên Locket...' : 'Đang bắn khoảnh khắc lên Widget...';

      try {
        const formData = new FormData();
        if (isVideoFile) {
          formData.append('video', selectedFile);
        } else {
          formData.append('image', selectedFile);
        }
        formData.append('caption', document.getElementById('cameraCaptionInput').value.trim());
        formData.append('frame_type', currentFrame);
        formData.append('weather_enabled', weatherEnabled ? 'true' : 'false');
        formData.append('weather_style', 'pill');
        formData.append('weather_pos', 'top_left');
        formData.append('weather_city', 'TP. Hồ Chí Minh');

        if (selectedFriendUids.length > 0 && selectedFriendUids.length < friendsList.length) {
          formData.append('recipients', JSON.stringify(selectedFriendUids));
        }

        const res = await fetch('/api/post', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          alert('🎉 Đã bắn khoảnh khắc lên Widget bạn bè thành công!');
          cancelCapturedMedia();
        } else {
          alert('Lỗi: ' + (data.error || 'Thất bại'));
        }
      } catch (e) {
        alert('Lỗi kết nối: ' + e);
      } finally {
        shutterBtn.disabled = false;
        shutterBtn.innerHTML = `<i id="btnShutterIcon" data-lucide="send" class="w-7 h-7 text-black"></i>`;
        lucide.createIcons();
      }
    }

    // ==========================================
    // FEED (XEM BẠN BÈ ĐĂNG GÌ)
    // ==========================================
    async function loadFeed() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = '<div class="text-xs text-slate-400 py-10">Đang tải khoảnh khắc bạn bè...</div>';

      try {
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error('Mã phản hồi server: ' + res.status);
        const data = await res.json();
        currentFeed = data.feed || [];

        if (currentFeed.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12 px-6">
              <i data-lucide="sparkles" class="w-10 h-10 text-pink-400 mx-auto mb-3"></i>
              <h4 class="text-sm font-bold text-white">Chưa có khoảnh khắc mới</h4>
              <p class="text-xs text-slate-400 mt-1">Khi bạn bè của bạn đăng khoảnh khắc, chúng sẽ xuất hiện tại đây.</p>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        container.innerHTML = currentFeed.map(item => `
          <div class="w-full max-w-[360px] space-y-3 mb-6">
            <!-- Author Header -->
            <div class="flex items-center justify-between px-2">
              <div class="flex items-center gap-2.5">
                ${item.author.profile_picture ? 
                  `<img src="${item.author.profile_picture}" class="w-8 h-8 rounded-full object-cover">` :
                  `<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-amber-500 flex items-center justify-center text-xs font-bold text-white">${(item.author.first_name || 'U')[0].toUpperCase()}</div>`
                }
                <div>
                  <div class="text-xs font-bold text-white">${item.author.first_name} ${item.author.last_name || ''}</div>
                  <div class="text-[10px] text-slate-400">@${item.author.username || 'locket'}</div>
                </div>
              </div>
            </div>

            <!-- Moment Frame -->
            <div class="locket-frame relative">
              ${item.video_url ? 
                `<video src="${item.video_url}" autoplay loop muted playsinline class="w-full h-full object-cover"></video>` :
                `<img src="${item.thumbnail_url}" class="w-full h-full object-cover">`
              }

              ${item.caption ? `
                <div class="absolute bottom-4 left-4 right-4 bg-black/60 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-white/10 flex items-center justify-center text-center">
                  <span class="text-xs font-semibold text-white">${item.caption}</span>
                </div>
              ` : ''}
            </div>

            <!-- Instant Reactions Bar -->
            <div class="flex items-center justify-between px-2 pt-1">
              <div class="flex items-center gap-2">
                <button onclick="sendReaction('${item.moment_uid}', '❤️')" class="glass-pill px-3 py-1.5 rounded-full text-sm active:scale-90 transition-all">❤️</button>
                <button onclick="sendReaction('${item.moment_uid}', '🔥')" class="glass-pill px-3 py-1.5 rounded-full text-sm active:scale-90 transition-all">🔥</button>
                <button onclick="sendReaction('${item.moment_uid}', '😂')" class="glass-pill px-3 py-1.5 rounded-full text-sm active:scale-90 transition-all">😂</button>
                <button onclick="sendReaction('${item.moment_uid}', '🥺')" class="glass-pill px-3 py-1.5 rounded-full text-sm active:scale-90 transition-all">🥺</button>
                <button onclick="sendReaction('${item.moment_uid}', '👏')" class="glass-pill px-3 py-1.5 rounded-full text-sm active:scale-90 transition-all">👏</button>
              </div>

              <!-- Reply message button -->
              <button onclick="openDirectChatFromMoment('${item.author.uid}', '${item.author.first_name}', '${item.author.username}', '${item.author.profile_picture || ''}')" class="glass-pill px-3 py-1.5 rounded-full text-xs font-semibold text-slate-300 flex items-center gap-1.5 active:scale-95 transition-all">
                <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
                <span>Nhắn tin</span>
              </button>
            </div>
          </div>
        `).join('');

        lucide.createIcons();
      } catch (e) {
        container.innerHTML = '<div class="text-xs text-rose-400 py-6 text-center">Lỗi tải khoảnh khắc: ' + e + '</div>';
      }
    }

    async function sendReaction(momentUid, emoji) {
      try {
        await fetch('/api/moments/react', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ moment_uid: momentUid, emoji: emoji })
        });
        alert(`Đã thả cảm xúc ${emoji} lên khoảnh khắc!`);
      } catch (e) {
        console.error(e);
      }
    }

    // ==========================================
    // CHAT (TIN NHẮN TRỰC TIẾP)
    // ==========================================
    async function loadConversations() {
      const container = document.getElementById('chatConversationsContainer');
      container.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">Đang tải cuộc trò chuyện...</div>';

      try {
        const res = await fetch('/api/chat/conversations');
        if (!res.ok) throw new Error('Mã phản hồi server: ' + res.status);
        const data = await res.json();
        const convs = data.conversations || [];
        document.getElementById('chatCountText').innerText = `${convs.length} cuộc trò chuyện`;

        if (convs.length === 0) {
          container.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">Chưa có tin nhắn nào.</div>';
          return;
        }

        container.innerHTML = convs.map(c => `
          <div onclick="openDirectChat('${c.peer.uid}', '${c.peer.first_name}', '${c.peer.username}', '${c.peer.profile_picture || ''}')" class="flex items-center justify-between p-3 rounded-2xl glass-pill cursor-pointer hover:bg-white/[0.06] active:scale-[0.99] transition-all">
            <div class="flex items-center gap-3">
              ${c.peer.profile_picture ? 
                `<img src="${c.peer.profile_picture}" class="w-10 h-10 rounded-full object-cover">` : 
                `<div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 to-indigo-500 flex items-center justify-center font-bold text-sm text-white">${(c.peer.first_name || 'U')[0].toUpperCase()}</div>`
              }
              <div>
                <div class="text-xs font-bold text-white">${c.peer.first_name} ${c.peer.last_name || ''}</div>
                <div class="text-[11px] text-slate-400 line-clamp-1">${c.last_message || 'Bấm để nhắn tin...'}</div>
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-500"></i>
          </div>
        `).join('');

        lucide.createIcons();
      } catch (e) {
        container.innerHTML = '<div class="text-xs text-rose-400 py-6 text-center">Lỗi tải tin nhắn: ' + e + '</div>';
      }
    }

    function openDirectChatFromMoment(uid, name, username, pic) {
      switchMainView('chat');
      openDirectChat(uid, name, username, pic);
    }

    async function openDirectChat(uid, name, username, pic) {
      activeChatPeerUid = uid;
      document.getElementById('chatListView').classList.add('hidden');
      document.getElementById('chatDirectView').classList.remove('hidden');

      document.getElementById('chatActivePeerName').innerText = name;
      document.getElementById('chatActivePeerUsername').innerText = '@' + username;
      const avatarElem = document.getElementById('chatActivePeerAvatar');
      if (pic) {
        avatarElem.outerHTML = `<img id="chatActivePeerAvatar" src="${pic}" class="w-8 h-8 rounded-full object-cover">`;
      } else {
        avatarElem.innerText = (name || 'U')[0].toUpperCase();
      }

      loadDirectMessages(uid);
    }

    function closeDirectChat() {
      activeChatPeerUid = null;
      document.getElementById('chatDirectView').classList.add('hidden');
      document.getElementById('chatListView').classList.remove('hidden');
    }

    async function loadDirectMessages(peerUid) {
      const container = document.getElementById('chatMessagesContainer');
      container.innerHTML = '<div class="text-xs text-slate-500 py-4 text-center">Đang tải tin nhắn...</div>';

      try {
        const res = await fetch(`/api/chat/messages?uid=${peerUid}`);
        const data = await res.json();
        const messages = data.messages || [];
        const myUid = data.my_uid;

        if (messages.length === 0) {
          container.innerHTML = '<div class="text-xs text-slate-500 py-8 text-center">Hãy bắt đầu gửi tin nhắn đầu tiên! 👋</div>';
          return;
        }

        container.innerHTML = messages.map(m => {
          const isMine = m.sender_uid === myUid;
          return `
            <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'}">
              <div class="max-w-[78%] px-3.5 py-2 rounded-2xl text-xs ${isMine ? 'bg-amber-400 text-black font-medium' : 'bg-white/10 text-white'}">
                ${m.text || ''}
              </div>
            </div>
          `;
        }).join('');

        container.scrollTop = container.scrollHeight;
      } catch (e) {
        container.innerHTML = '<div class="text-xs text-rose-400 py-4 text-center">Lỗi tải tin nhắn: ' + e + '</div>';
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chatMessageInput');
      const text = input.value.trim();
      if (!text || !activeChatPeerUid) return;

      input.value = '';
      try {
        await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to_uid: activeChatPeerUid, text: text })
        });
        loadDirectMessages(activeChatPeerUid);
      } catch (e) {
        alert('Lỗi gửi tin nhắn: ' + e);
      }
    }

    // Friends Modal
    async function loadFriends() {
      try {
        const res = await fetch('/api/friends');
        const data = await res.json();
        friendsList = data.friends || [];
        selectedFriendUids = friendsList.map(f => f.uid);
        document.getElementById('headerFriendsText').innerText = `${friendsList.length} Bạn bè`;

        const modalList = document.getElementById('modalFriendsList');
        modalList.innerHTML = friendsList.map(f => `
          <label class="flex items-center justify-between p-3 rounded-2xl bg-white/[0.03] hover:bg-white/[0.06] cursor-pointer">
            <div class="flex items-center gap-3">
              ${f.profile_picture ? 
                `<img src="${f.profile_picture}" class="w-9 h-9 rounded-full object-cover">` : 
                `<div class="w-9 h-9 rounded-full bg-gradient-to-tr from-pink-500 to-indigo-500 flex items-center justify-center text-xs font-bold text-white">${(f.first_name || 'U')[0].toUpperCase()}</div>`
              }
              <div>
                <div class="text-xs font-bold text-white">${f.first_name} ${f.last_name || ''}</div>
                <div class="text-[10px] text-slate-400">@${f.username || 'locket'}</div>
              </div>
            </div>
            <input type="checkbox" checked value="${f.uid}" onchange="toggleFriendSelect('${f.uid}')" class="rounded bg-slate-800 border-white/20 text-pink-500 focus:ring-0">
          </label>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    function toggleFriendSelect(uid) {
      if (selectedFriendUids.includes(uid)) {
        selectedFriendUids = selectedFriendUids.filter(id => id !== uid);
      } else {
        selectedFriendUids.push(uid);
      }
    }

    function openFriendsModal() {
      document.getElementById('friendsModal').classList.remove('hidden');
    }

    function closeFriendsModal() {
      document.getElementById('friendsModal').classList.add('hidden');
    }

    // Startup
    window.addEventListener('DOMContentLoaded', () => {
      startLiveCamera();
      loadFriends();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(e => console.log(e));
      }
    });
  </script>
</body>
</html>
